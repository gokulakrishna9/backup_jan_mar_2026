# AI Configuration for Workspace Web App Engine Service
# Providers use LiteLLM model ID prefixes for routing.
# Environment variables listed in api_key_env take precedence over
# any keys stored in this file.

default_model: gpt-4
fallback_model: ollama/llama3

model_params:
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0.0

providers:
  - name: OpenAI
    api_key_env: OPENAI_API_KEY
    models:
      - id: gpt-4
        display_name: GPT-4
      - id: gpt-4-turbo
        display_name: GPT-4 Turbo
      - id: gpt-4o
        display_name: GPT-4o
      - id: gpt-4o-mini
        display_name: GPT-4o Mini
      - id: gpt-3.5-turbo
        display_name: GPT-3.5 Turbo

  - name: Anthropic
    api_key_env: ANTHROPIC_API_KEY
    models:
      - id: claude-3-5-sonnet-20241022
        display_name: Claude 3.5 Sonnet
      - id: claude-3-opus-20240229
        display_name: Claude 3 Opus
      - id: claude-3-sonnet-20240229
        display_name: Claude 3 Sonnet
      - id: claude-3-haiku-20240307
        display_name: Claude 3 Haiku

  - name: Google
    api_key_env: GEMINI_API_KEY
    models:
      - id: gemini/gemini-1.5-pro
        display_name: Gemini 1.5 Pro
      - id: gemini/gemini-1.5-flash
        display_name: Gemini 1.5 Flash
      - id: gemini/gemini-pro
        display_name: Gemini Pro

  - name: Ollama
    api_key_env: OLLAMA_API_BASE
    models:
      - id: ollama/llama3
        display_name: Llama 3
      - id: ollama/llama3:70b
        display_name: Llama 3 70B
      - id: ollama/codellama
        display_name: Code Llama
      - id: ollama/mistral
        display_name: Mistral 7B
      - id: ollama/mixtral
        display_name: Mixtral 8x7B

  - name: Together AI
    api_key_env: TOGETHERAI_API_KEY
    models:
      - id: together_ai/meta-llama/Llama-3-70b-chat-hf
        display_name: Llama 3 70B
      - id: together_ai/meta-llama/Llama-3-8b-chat-hf
        display_name: Llama 3 8B
      - id: together_ai/mistralai/Mixtral-8x7B-Instruct-v0.1
        display_name: Mixtral 8x7B
      - id: together_ai/codellama/CodeLlama-34b-Instruct-hf
        display_name: Code Llama 34B

  - name: Groq
    api_key_env: GROQ_API_KEY
    models:
      - id: groq/llama3-70b-8192
        display_name: Llama 3 70B
      - id: groq/llama3-8b-8192
        display_name: Llama 3 8B
      - id: groq/mixtral-8x7b-32768
        display_name: Mixtral 8x7B
      - id: groq/gemma-7b-it
        display_name: Gemma 7B

  - name: AWS Bedrock
    api_key_env: AWS_ACCESS_KEY_ID
    models:
      - id: bedrock/anthropic.claude-3-sonnet-20240229-v1:0
        display_name: Claude 3 Sonnet (Bedrock)
      - id: bedrock/anthropic.claude-3-haiku-20240307-v1:0
        display_name: Claude 3 Haiku (Bedrock)
      - id: bedrock/meta.llama3-70b-instruct-v1:0
        display_name: Llama 3 70B (Bedrock)
      - id: bedrock/meta.llama3-8b-instruct-v1:0
        display_name: Llama 3 8B (Bedrock)
      - id: bedrock/amazon.titan-text-express-v1
        display_name: Amazon Titan Text Express

custom_endpoints: []
